services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourPassword123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - taskmanager-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taskmanager-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=TaskManagerDb;User ID=sa;Password=YourPassword123!;Encrypt=false;TrustServerCertificate=true;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=5,connectTimeout=5000,syncTimeout=5000"
      CacheOptions__DefaultTtlSeconds: "300"
      JwtSettings__SecretKey: "your-super-secret-key-change-this-in-production-min-32-chars-needed!"
      JwtSettings__Issuer: "TaskManager"
      JwtSettings__Audience: "TaskManagerClient"
      JwtSettings__ExpirationHours: "24"
    ports:
      - "5000:80"
    networks:
      - taskmanager-network

volumes:
  sqlserver_data:

networks:
  taskmanager-network:
    driver: bridge
